name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run logic tests (SQLite mocks — no real credentials needed)
        run: |
          cd tests
          python3 test_dashboard_logic.py
          python3 test_write_operations.py

      - name: Trading safety regression tests (offline, broker write tripwires)
        run: python3 tests/test_trading_safety.py

      - name: Mobile app authentication and data tests
        run: |
          pip install -r dashboard/mobile-requirements.txt httpx python-dotenv
          python3 dashboard/mobile_tests/test_app.py

      - name: Syntax-check all Python files
        run: |
          find . -name "*.py" -exec python3 -m py_compile {} +
